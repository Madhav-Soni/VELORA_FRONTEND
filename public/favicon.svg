<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Dark background radial -->
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0a0612"/>
    </radialGradient>
    <!-- V letter gradient: crimson to amber cinematic -->
    <linearGradient id="vgrad" x1="6" y1="7" x2="26" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="55%" stop-color="#FF6B1A"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle inner glow on V -->
    <filter id="vglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Subtle background film-reel arc hint (very subtle) -->
  <circle cx="16" cy="16" r="12.5" stroke="#FF4D4D" stroke-width="0.18" stroke-opacity="0.18" fill="none"/>

  <!-- The V — bold, clean, cinematic. Two strokes forming a sharp V -->
  <g filter="url(#vglow)">
    <path
      d="M6 7.5 L15.1 25.5 C15.45 26.15 16.55 26.15 16.9 25.5 L26 7.5"
      stroke="url(#vgrad)"
      stroke-width="3.6"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Inner bright highlight on left arm only — cinematic light hit -->
    <path
      d="M7.2 7.5 L15.4 24.0"
      stroke="#FFD0A0"
      stroke-width="0.7"
      stroke-linecap="round"
      stroke-opacity="0.45"
      fill="none"
    />
  </g>

  <!-- Bottom accent glow dot at vertex -->
  <ellipse cx="16" cy="25.2" rx="1.6" ry="0.7" fill="#FF6B1A" opacity="0.55" filter="url(#glow)"/>

  <!-- Top-edge ambient glow strip -->
  <rect x="6" y="7" width="20" height="0.5" rx="0.25" fill="#FF4D4D" opacity="0.08"/>
</svg>
